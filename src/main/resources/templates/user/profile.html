<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<a href="/logout" th:href="@{/logout}" class="btn btn-danger mb-3">Logout</a>

<h2>User Profile</h2>

<div class="card">
    <div class="card-body">
        <h4 class="card-title">User Information</h4>
        <p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
        <p><strong>Name:</strong> <span th:text="${user.name}"></span></p>
        <p><strong>Year:</strong> <span th:text="${user.year}"></span></p>
        <p><strong>Gender:</strong> <span th:text="${user.gender}"></span></p>
        <p><strong>Online:</strong> <span th:text="${user.online} ? 'Yes' : 'No'"></span></p>
    </div>
</div>

</body>
</html>
