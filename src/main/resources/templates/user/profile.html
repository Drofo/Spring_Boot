<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Information Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #007bff;
        }

        .content {
            flex: 1;
            padding: 2rem;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h4>User Panel</h4>
    <hr>
    <a href="/user" class="active">User</a>

    <div th:each="role : ${user.roles}" th:if="${role.name == 'ROLE_ADMIN'}">
        <hr>
        <a href="/admin" class="btn btn-outline-light btn-sm">Admin Panel</a>
    </div>

    <div class="mt-auto">
        <hr>
        <span th:text="${user.username} + ' with roles: '"></span>
        <ul>
            <li th:each="role : ${user.roles}" th:text="${role.name}"></li>
        </ul>
        <a href="/logout" th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</div>

<div class="content">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand">User Information Page</span>
        </div>
    </nav>

    <h2 class="mb-4">About User</h2>

    <div class="card">
        <div class="card-body">
            <h4 class="card-title">User Details</h4>
            <table class="table table-bordered mt-3">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Gender</th>
                    <th>Online</th>
                    <th>Role</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.year}"></td>
                    <td th:text="${user.gender}"></td>
                    <td th:text="${user.online}"></td>
                    <td>
                        <span th:each="role : ${user.roles}" th:text="${role.name}"
                              class="badge bg-secondary me-1"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
<script src="/js/profile.js" defer></script>
</html>
