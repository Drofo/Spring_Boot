<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin_panel.js" defer></script>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #007bff;
        }

        .content {
            flex: 1;
            padding: 2rem;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h4>Admin Panel</h4>
    <hr>
    <a href="/admin" class="active">Admin</a>
    <a href="/user">User</a>
    <div class="mt-auto">
        <hr>
        <span>admin@admin [ADMIN]</span>
        <a href="/logout" class="btn btn-outline-light btn-sm mt-2">Logout</a>
    </div>
</div>
<div class="content">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Panel</a>
        </div>
    </nav>
    <h1>Admin panel</h1>
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="all-users-tab" data-bs-toggle="tab" data-bs-target="#all-users"
                    type="button" role="tab" aria-controls="all-users" aria-selected="true">All Users
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="new-user-tab" data-bs-toggle="tab" data-bs-target="#new-user" type="button"
                    role="tab" aria-controls="new-user" aria-selected="false">New User
            </button>
        </li>
    </ul>
    <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="all-users" role="tabpanel" aria-labelledby="all-users-tab">
            <table class="table mt-4">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Gender</th>
                    <th>Roles</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <div class="tab-pane fade" id="new-user" role="tabpanel" aria-labelledby="new-user-tab">
            <form id="add-user-form" class="mt-4">
                <div class="mb-3">
                    <label for="new_username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="new_username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="new_name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="new_name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="new_year" class="form-label">Year</label>
                    <input type="number" class="form-control" id="new_year" name="year" required>
                </div>
                <div class="mb-3">
                    <label for="new_gender" class="form-label">Gender</label>
                    <input type="text" class="form-control" id="new_gender" name="gender" required>
                </div>
                <div class="mb-3">
                    <label for="new_online" class="form-label">Online Status</label>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="new_online" name="online">
                        <label class="form-check-label" for="new_online">Is Online</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="new_password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="new_roles" class="form-label">Role</label>
                    <select class="form-select" id="new_roles" name="roles" multiple required></select>
                </div>
                <button type="submit" class="btn btn-success">Add new user</button>
            </form>
        </div>
    </div>
</div>
</body>
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="edit-user-form">
                    <input type="hidden" id="edit_user_id" name="id">
                    <div class="mb-3">
                        <label for="edit_username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="edit_username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit_name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="edit_name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit_year" class="form-label">Year</label>
                        <input type="number" class="form-control" id="edit_year" name="year" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit_gender" class="form-label">Gender</label>
                        <input type="text" class="form-control" id="edit_gender" name="gender" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit_online" class="form-label">Online Status</label>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="edit_online" name="online">
                            <label class="form-check-label" for="edit_online">Is Online</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="edit_roles" class="form-label">Roles</label>
                        <select class="form-select" id="edit_roles" name="roles" multiple required></select>
                    </div>
                    <button type="submit" class="btn btn-info">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteUserModalLabel">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="delete-user-form">
                    <input type="hidden" id="delete_user_id" name="id">
                    <div class="mb-3">
                        <label for="delete_username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="delete_username" name="username" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="delete_name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="delete_name" name="name" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="delete_year" class="form-label">Year</label>
                        <input type="number" class="form-control" id="delete_year" name="year" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="delete_gender" class="form-label">Gender</label>
                        <input type="text" class="form-control" id="delete_gender" name="gender" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="delete_online" class="form-label">Status</label>
                        <input type="text" class="form-control" id="delete_online" name="online" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="delete_roles" class="form-label">Roles</label>
                        <input type="text" class="form-control" id="delete_roles" name="roles" readonly>
                    </div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

</html>
