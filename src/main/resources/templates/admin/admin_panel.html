<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #007bff;
        }

        .content {
            flex: 1;
            padding: 2rem;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h4>Admin Panel</h4>
    <hr>
    <a href="/admin" class="active">Admin</a>
    <a href="/user">User</a>
    <div class="mt-auto">
        <hr>
        <span>admin@admin [ADMIN]</span>
        <a href="/logout" class="btn btn-outline-light btn-sm mt-2">Logout</a>
    </div>
</div>
<div class="content">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Panel</a>
        </div>
    </nav>
    <h1>Admin panel</h1>
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="all-users-tab" data-bs-toggle="tab" data-bs-target="#all-users"
                    type="button" role="tab" aria-controls="all-users" aria-selected="true">All Users
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="new-user-tab" data-bs-toggle="tab" data-bs-target="#new-user" type="button"
                    role="tab" aria-controls="new-user" aria-selected="false">New User
            </button>
        </li>
    </ul>
    <div class="tab-content" id="myTabContent">

        <!--USERS-->
        <div class="tab-pane fade show active" id="all-users" role="tabpanel" aria-labelledby="all-users-tab">
            <table class="table mt-4">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Year</th>
                    <th>Gender</th>
                    <th>Roles</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${users != null}" th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.year}"></td>
                    <td th:text="${user.gender}"></td>
                    <td th:each="role : ${user.roles}" th:text="${#strings.substringAfter(role.name, 'ROLE_')}"></td>
                    <td>
                        <button class="btn btn-info" data-bs-toggle="modal"
                                th:attr="data-bs-target='#editUserModal_' + ${user.id}">Edit
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-danger" data-bs-toggle="modal"
                                th:attr="data-bs-target='#deleteUserModal_' + ${user.id}">Delete
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--ADD-->
        <div class="tab-pane fade" id="new-user" role="tabpanel" aria-labelledby="new-user-tab">
            <form th:action="@{/admin/add}" method="post" class="mt-4">
                <div class="mb-3">
                    <label for="new_username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="new_username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="new_name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="new_name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="new_year" class="form-label">Year</label>
                    <input type="number" class="form-control" id="new_year" name="year" required>
                </div>
                <div class="mb-3">
                    <label for="new_gender" class="form-label">Gender</label>
                    <input type="text" class="form-control" id="new_gender" name="gender" required>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="new_password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="new_roles" class="form-label">Role</label>
                    <select class="form-select" id="new_roles" name="roles" multiple required>
                        <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role.name}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Add new user</button>
            </form>
        </div>

        <!--EDIT-->
        <div th:if="${users != null}" th:each="user : ${users}">
            <div class="modal fade" th:id="'editUserModal_' + ${user.id}" tabindex="-1"
                 aria-labelledby="'editUserModalLabel_' + ${user.id}" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" th:id="'editUserModalLabel_' + ${user.id}">Edit user</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action="@{/admin/edit}" method="post">
                            <div class="modal-body">
                                <input type="hidden" name="id" th:value="${user.id}">
                                <div class="mb-3">
                                    <label th:for="'edit_username_' + ${user.id}" class="form-label">Username</label>
                                    <input type="text" class="form-control" th:id="'edit_username_' + ${user.id}"
                                           name="username" th:value="${user.username}" required>
                                </div>
                                <div class="mb-3">
                                    <label th:for="'edit_name_' + ${user.id}" class="form-label">Name</label>
                                    <input type="text" class="form-control" th:id="'edit_name_' + ${user.id}"
                                           name="name" th:value="${user.name}" required>
                                </div>
                                <div class="mb-3">
                                    <label th:for="'edit_year_' + ${user.id}" class="form-label">Year</label>
                                    <input type="number" class="form-control" th:id="'edit_year_' + ${user.id}"
                                           name="year" th:value="${user.year}" required>
                                </div>
                                <div class="mb-3">
                                    <label th:for="'edit_gender_' + ${user.id}" class="form-label">Gender</label>
                                    <input type="text" class="form-control" th:id="'edit_gender_' + ${user.id}"
                                           name="gender" th:value="${user.gender}" required>
                                </div>
                                <div class="mb-3">
                                    <label th:for="'edit_roles_' + ${user.id}" class="form-label">Roles</label>
                                    <select class="form-select" th:id="'edit_roles_' + ${user.id}" name="roles" multiple
                                            required>
                                        <option th:each="role : ${allRoles}" th:value="${role.id}"
                                                th:text="${role.name}"
                                                th:attrappend="selected=${user.roles.contains(role)}"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-info">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>


        <!--DELETE-->
        <div th:each="user : ${users}">
            <div class="modal fade" th:id="'deleteUserModal_' + ${user.id}" tabindex="-1"
                 aria-labelledby="'deleteUserModalLabel_' + ${user.id}" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" th:id="'deleteUserModalLabel_' + ${user.id}">Delete user</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action="@{/admin/delete/{id}(id=${user.id})}" method="post">
                            <div class="modal-body">
                                <p>Are you sure you want to delete the following user?</p>
                                <ul>
                                    <li><strong>ID:</strong> <span th:text="${user.id}"></span></li>
                                    <li><strong>Name:</strong> <span th:text="${user.name}"></span></li>
                                    <li><strong>Year:</strong> <span th:text="${user.year}"></span></li>
                                    <li><strong>Gender:</strong> <span th:text="${user.gender}"></span></li>
                                    <li><strong>Roles:</strong> <span th:each="role : ${user.roles}"
                                                                      th:text="${role.name}"
                                                                      class="badge bg-secondary me-1"></span>
                                </ul>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
